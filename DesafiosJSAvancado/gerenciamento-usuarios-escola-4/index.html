<!-- Essa é uma continuação do desafio anterior.
Hora de separar responsabilidades no app! Vamos criar um Service para lidar com os
dados dos usuários e usar injeção de dependência no controller.
Objetivo:
Delegar a lógica de manipulação dos usuários para um service, mantendo o controller
mais limpo.
Requisitos:
 Crie um módulo AngularJS com um service chamado UsuarioService.
 No UsuarioService, implemente:
 Um array privado de usuarios
 Um método listar() que retorna esse array
 Um método adicionar(usuario) para adicionar um novo usuário
No AppController, injete o UsuarioService e use ele para:
 Listar os usuários no scope
 Adicionar um novo usuário (pode ser um botão com função)
 Na tela, mostre os usuários com ng-repeat e adicione um formulário simples para
adicionar novos (nome e tipo).
Adicione um método remover(index) no service
Crie um botão "Remover" para excluir usuários da lista
Dica: use .controller() e .service() na mesma app
Ex: angular.module('app', []).service('UsuarioService', function() { ... }) -->

<!doctype html>
<html ng-app="appUsuarios" lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="style.css">
    <title>Usuários</title>

    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>

    <script src="script.js"></script>
    <script src="usuario.service.js"></script>
    <script src="app.controller.js"></script>
  </head>

  <body ng-controller="AppController">
    <h1>Cadastro de Usuário</h1>

    <form name="formUsuario" ng-submit="salvarUsuario(formUsuario)" novalidate>
      <input
        type="text"
        name="nome"
        placeholder="Nome"
        ng-model="usuario.nome"
        required
      />

      <div
        class="erro"
        ng-show="formUsuario.nome.$touched && formUsuario.nome.$error.required"
      >
        Nome é obrigatório
      </div>

      <input
        type="email"
        name="email"
        placeholder="Email"
        ng-model="usuario.email"
        required
      />

      <div
        class="erro"
        ng-show="formUsuario.email.$touched && formUsuario.email.$error.required"
      >
        Email é obrigatório
      </div>

      <div
        class="erro"
        ng-show="formUsuario.email.$touched && formUsuario.email.$error.email"
      >
        Email inválido
      </div>

      <select name="tipo" ng-model="usuario.tipo" required>
        <option value="">Selecione</option>
        <option value="Aluno">Aluno</option>
        <option value="Professor">Professor</option>
      </select>

      <div
        class="erro"
        ng-show="formUsuario.tipo.$touched && formUsuario.tipo.$error.required"
      >
        Tipo é obrigatório
      </div>

      <button type="submit" ng-disabled="formUsuario.$invalid || carregando">
        {{ carregando ? "Salvando..." : "Cadastrar" }}
      </button>
    </form>

    <p ng-show="carregando">Carregando...</p>
    <p class="sucesso" ng-show="mensagemSucesso">{{ mensagemSucesso }}</p>
  </body>
</html>
