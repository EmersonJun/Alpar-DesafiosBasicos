<!-- Essa é uma continuação do desafio anterior.
Hora de separar responsabilidades no app! Vamos criar um Service para lidar com os
dados dos usuários e usar injeção de dependência no controller.
Objetivo:
Delegar a lógica de manipulação dos usuários para um service, mantendo o controller
mais limpo.
Requisitos:
 Crie um módulo AngularJS com um service chamado UsuarioService.
 No UsuarioService, implemente:
 Um array privado de usuarios
 Um método listar() que retorna esse array
 Um método adicionar(usuario) para adicionar um novo usuário
No AppController, injete o UsuarioService e use ele para:
 Listar os usuários no scope
 Adicionar um novo usuário (pode ser um botão com função)
 Na tela, mostre os usuários com ng-repeat e adicione um formulário simples para
adicionar novos (nome e tipo).
Adicione um método remover(index) no service
Crie um botão "Remover" para excluir usuários da lista
Dica: use .controller() e .service() na mesma app
Ex: angular.module('app', []).service('UsuarioService', function() { ... }) -->

<!doctype html>
<html ng-app="appUsuarios" lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <title>Usuários</title>

    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>

    <script src="script.js"></script>
    <script src="usuario.service.js"></script>
    <script src="app.controller.js"></script>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: Arial, sans-serif;
        background-color: #f4f6f8;
        padding: 20px;
      }

      h1 {
        margin-bottom: 20px;
        color: #333;
      }

      form {
        background: #fff;
        padding: 15px;
        border-radius: 8px;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        margin-bottom: 20px;
      }

      form input,
      form select {
        padding: 8px;
        margin-right: 10px;
        border: 1px solid #ccc;
        border-radius: 5px;
      }

      button {
        padding: 8px 12px;
        border: none;
        border-radius: 5px;
        background-color: #4caf50;
        color: white;
        cursor: pointer;
        transition: 0.2s;
      }

      button:hover {
        background-color: #45a049;
      }

      .user-card {
        background: #fff;
        border-radius: 8px;
        padding: 15px;
        margin-bottom: 10px;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);

        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .user-info h3 {
        color: #222;
      }

      .user-info p {
        color: #666;
        font-size: 14px;
      }

      .btn-remove {
        background-color: #e74c3c;
      }

      .btn-remove:hover {
        background-color: #c0392b;
      }
    </style>
  </head>

  <body ng-controller="AppController">
    <h1>Usuários</h1>

    <form ng-submit="adicionarUsuario()">
      <input type="text" placeholder="Nome" ng-model="novo.nome" />

      <select ng-model="novo.tipo">
        <option value="Aluno">Aluno</option>
        <option value="Professor">Professor</option>
      </select>

      <button type="submit">Adicionar</button>
    </form>

    <div ng-repeat="u in usuarios track by $index">
      <h3>{{ u.nome }}</h3>
      <p>{{ u.tipo }}</p>

      <button ng-click="removerUsuario($index)">Remover</button>
    </div>
  </body>
</html>
