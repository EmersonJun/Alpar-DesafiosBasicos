<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="./assets/css/style.css" />
    <title>Podcast</title>
  </head>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      color: #333;
      padding: 20px;
      line-height: 1.6;
    }

    h1 {
      text-align: center;
      color: #222;
      margin-bottom: 10px;
    }

    h2 {
      margin-top: 20px;
      color: #444;
    }

    h3 {
      margin-top: 15px;
      color: #555;
    }

    p {
      margin: 10px 0;
    }

    hr {
      margin: 15px 0;
      border: 1px solid #ddd;
    }

    audio {
      display: block;
      margin: 10px 0 20px;
      width: 100%;
      max-width: 400px;
    }

    .container {
      max-width: 800px;
      margin: auto;
    }
  </style>
  <body>
    <h1>Dev</h1>

    <p>Bem-vindo a um podcast sobre programação, tecnologia</p>

    <h2>Apresentação</h2>

    <hr />

    <h2>Episódios em Áudio</h2>

    <h3>Episódio 1</h3>
    <audio controls>
      <source
        src="../desafios/assets/sound/blayze-welcome-1.mp3"
        type="audio/mp3"
      />
      Seu navegador não suporta áudio.
    </audio>

    <p>Conversa sobre os motivos reais para entrar na área de tecnologia</p>

    <h3>Episódio 2</h3>
    <audio controls>
      <source
        src="../desafios/assets/sound/ring-ring-ring-banana-phoneeee.mp3"
        type="audio/mp3"
      />
      Seu navegador não suporta áudio.
    </audio>

    <p>Um episódio mais direto</p>
  </body>
</html>
